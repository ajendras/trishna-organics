<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Trishna Organics — Organic store from Najibabad, UP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020c05"/><stop offset=".55" stop-color="#062014"/><stop offset="1" stop-color="#13140a"/></linearGradient>
    <radialGradient id="halo" cx="930" cy="190" r="270" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4ade80" stop-opacity=".32"/><stop offset=".5" stop-color="#a3e635" stop-opacity=".14"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx=".36" cy=".32" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset=".35" stop-color="#4ade80" stop-opacity=".35"/><stop offset="1" stop-color="#13140a" stop-opacity=".25"/></radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/><stop offset=".33" stop-color="#a3e635"/><stop offset=".66" stop-color="#fbbf24"/><stop offset="1" stop-color="#4ade80"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3e635" stop-opacity="0"/><stop offset="1" stop-color="#fbbf24" stop-opacity=".75"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="floor"><rect x="0" y="345" width="1200" height="75"/></clipPath>
