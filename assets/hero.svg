    <circle r="4.5" fill="#4ade80" filter="url(#glow)"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M734 190a196 46 0 1 0 392 0a196 46 0 1 0 -392 0"/></circle>
